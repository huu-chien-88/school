<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sơ đồ Trường học</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
      padding: 10px;
    }

    /* --- KHUNG CHỨA CO GIÃN TỰ ĐỘNG THEO MÀN HÌNH --- */
    .map-responsive-wrapper {
      position: relative;
      width: 100%;
      max-width: 1000px; /* Không vượt quá kích thước gốc trên máy tính */
      /* Tỷ lệ khung hình: (620 / 1000) * 100 = 62% */
      padding-bottom: 62%;
      height: 0;
      background: #f8fafc;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.8);
      overflow: hidden;
    }

    /* Đưa SVG viewport phủ kín và tự động thu nhỏ toàn bộ nội dung bên trong */
    .map-responsive-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* --- CÁC KHỐI TOÀ NHÀ VẪN GIỮ NGUYÊN VỊ TRÍ GỐC --- */
    .block {
      position: absolute;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      cursor: pointer;
      filter: drop-shadow(3px 8px 10px rgba(0, 0, 0, 0.15));
    }

    .block:hover {
      transform: translateY(-6px) scale(1.02);
      filter: drop-shadow(5px 15px 18px rgba(0, 0, 0, 0.25));
    }

    /* Vị trí các tòa nhà (Giữ nguyên từ file gốc) */
    .toa-a1       { top: 25px;  left: 30px;  width: 320px; height: 80px; }
    .bridge-left  { top: 105px; left: 55px;  width: 20px;  height: 30px; }
    .bridge-right { top: 105px; left: 305px; width: 20px;  height: 30px; }
    .toa-h1       { top: 135px; left: 30px;  width: 70px;  height: 310px; }
    .toa-h2       { top: 135px; left: 280px; width: 70px;  height: 310px; }
    .san-truong   { top: 135px; left: 100px; width: 180px; height: 310px; }
    .cong         { top: 465px; left: 100px; width: 180px; height: 65px; }
    .toa-h3       { top: 135px; left: 400px; width: 70px;  height: 310px; }
    .nha-an       { top: 25px;  left: 680px; width: 190px; height: 80px; }
    .ban-tru-1    { top: 135px; left: 560px; width: 180px; height: 80px; }
    .ban-tru-2    { top: 135px; left: 770px; width: 180px; height: 80px; }
    .nha-da-nang  { top: 245px; left: 560px; width: 180px; height: 200px; }
    .san-bong     { top: 245px; left: 770px; width: 180px; height: 200px; }

    /* Định dạng chữ (Giữ nguyên từ file gốc) */
    text {
      font-weight: 700;
      font-size: 14px;
      fill: #1e293b;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
      letter-spacing: 0.5px;
    }
    .text-light { fill: black; }
  </style>
</head>
<body>

  <!-- Khung chứa co giãn linh hoạt -->
  <div class="map-responsive-wrapper">
    <!-- viewBox giúp thu nhỏ toàn bộ HTML/SVG bên trong theo đúng tỷ lệ 1000x620 -->
    <svg class="map-responsive-svg" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet">
      <foreignObject width="1000" height="620">
        <div style="position: relative; width: 1000px; height: 620px;" xmlns="http://www.w3.org/1999/xhtml">

          <svg width="0" height="0">
            <defs>
              <!-- Gradients -->
              <linearGradient id="roof-blue" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#60a5fa" /><stop offset="100%" stop-color="#2563eb" /></linearGradient>
              <linearGradient id="roof-orange" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fb923c" /><stop offset="100%" stop-color="#ea580c" /></linearGradient>
              <linearGradient id="roof-purple" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#c084fc" /><stop offset="100%" stop-color="#7e22ce" /></linearGradient>
              <linearGradient id="wall-grad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#f1f5f9" /><stop offset="100%" stop-color="#cbd5e1" /></linearGradient>
              <linearGradient id="grass-grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4ade80" /><stop offset="100%" stop-color="#16a34a" /></linearGradient>
              <!-- Pattern gạch -->
              <pattern id="paving" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M 20 0 L 0 0 0 20" fill="none" stroke="#fcd34d" stroke-width="1" opacity="0.4"/></pattern>
            </defs>
          </svg>

          <!-- GIỮ NGUYÊN 100% CÁC KHỐI SVG TỪ FILE CỦA BẠN -->
          <!-- 1. TÒA A1 -->
          <svg class="block toa-a1">
            <rect x="0" y="10" width="320" height="70" rx="8" fill="url(#wall-grad)"/>
            <rect x="0" y="0" width="320" height="40" rx="6" fill="url(#roof-blue)"/>
            <line x1="20" y1="55" x2="300" y2="55" stroke="#94a3b8" stroke-width="6" stroke-dasharray="12,8"/>
            <text x="160" y="20" class="text-light">Tòa A1</text>
          </svg>

          <!-- HÀNH LANG NỐI -->
          <svg class="block bridge-left"><rect x="0" y="0" width="20" height="30" rx="3" fill="#94a3b8"/><line x1="0" y1="10" x2="20" y2="10" stroke="#f1f5f9" stroke-width="2"/><line x1="0" y1="20" x2="20" y2="20" stroke="#f1f5f9" stroke-width="2"/></svg>
          <svg class="block bridge-right"><rect x="0" y="0" width="20" height="30" rx="3" fill="#94a3b8"/><line x1="0" y1="10" x2="20" y2="10" stroke="#f1f5f9" stroke-width="2"/><line x1="0" y1="20" x2="20" y2="20" stroke="#f1f5f9" stroke-width="2"/></svg>

          <!-- 2. TÒA H1 -->
          <svg class="block toa-h1">
            <rect x="0" y="0" width="70" height="310" rx="8" fill="url(#wall-grad)"/>
            <rect x="0" y="0" width="35" height="310" rx="6" fill="url(#roof-blue)"/>
            <line x1="52" y1="20" x2="52" y2="290" stroke="#94a3b8" stroke-width="6" stroke-dasharray="12,8"/>
            <text x="18" y="155" class="text-light" transform="rotate(-90 18 155)">Tòa H1</text>
          </svg>

          <!-- 3. TÒA H2 -->
          <svg class="block toa-h2">
            <rect x="0" y="0" width="70" height="310" rx="8" fill="url(#wall-grad)"/>
            <rect x="35" y="0" width="35" height="310" rx="6" fill="url(#roof-blue)"/>
            <line x1="18" y1="20" x2="18" y2="290" stroke="#94a3b8" stroke-width="6" stroke-dasharray="12,8"/>
            <text x="52" y="155" class="text-light" transform="rotate(90 52 155)">Tòa H2</text>
          </svg>

          <!-- 4. SÂN TRƯỜNG -->
          <svg class="block san-truong">
            <rect x="0" y="0" width="180" height="310" rx="10" fill="#fef3c7"/>
            <text x="90" y="150">Sân trường</text>
          </svg>

          <!-- 5. CỔNG TRƯỜNG -->
          <svg class="block cong">
            <path d="M 10 25 Q 90 -5 170 25 L 170 10 Q 90 -20 10 10 Z" fill="#b91c1c"/><rect x="15" y="15" width="28" height="45" fill="#dc2626" rx="4"/><rect x="137" y="15" width="28" height="45" fill="#dc2626" rx="4"/>
            <text x="90" y="35" font-size="12" class="text-light">CỔNG</text>
          </svg>

          <!-- 6. TÒA H3 -->
          <svg class="block toa-h3">
            <rect x="0" y="0" width="70" height="310" rx="8" fill="url(#wall-grad)"/>
            <rect x="0" y="0" width="35" height="310" rx="6" fill="url(#roof-blue)"/>
            <line x1="52" y1="20" x2="52" y2="290" stroke="#94a3b8" stroke-width="6" stroke-dasharray="12,8"/>
            <text x="18" y="155" class="text-light" transform="rotate(-90 18 155)">Tòa H3</text>
          </svg>

          <!-- 7. NHÀ ĂN -->
          <svg class="block nha-an">
            <rect x="0" y="10" width="190" height="70" rx="8" fill="url(#wall-grad)"/>
            <polygon points="0,15 95,0 190,15 190,35 0,35" fill="url(#roof-orange)"/>
            <text x="95" y="22" class="text-light">Nhà ăn</text>
          </svg>

          <!-- 8. BÁN TRÚ 1 & 2 -->
          <svg class="block ban-tru-1"><rect x="0" y="10" width="180" height="70" rx="8" fill="url(#wall-grad)"/><rect x="0" y="0" width="180" height="35" rx="6" fill="url(#roof-blue)"/><line x1="15" y1="52" x2="165" y2="52" stroke="#94a3b8" stroke-width="5" stroke-dasharray="10,6"/><text x="90" y="18" class="text-light">Bán trú 1</text></svg>
          <svg class="block ban-tru-2"><rect x="0" y="10" width="180" height="70" rx="8" fill="url(#wall-grad)"/><rect x="0" y="0" width="180" height="35" rx="6" fill="url(#roof-blue)"/><line x1="15" y1="52" x2="165" y2="52" stroke="#94a3b8" stroke-width="5" stroke-dasharray="10,6"/><text x="90" y="18" class="text-light">Bán trú 2</text></svg>

          <!-- 9. NHÀ ĐA NĂNG -->
          <svg class="block nha-da-nang">
            <rect x="0" y="15" width="180" height="185" rx="10" fill="url(#wall-grad)"/><path d="M 0 50 Q 90 0 180 50 L 180 15 Q 90 -20 0 15 Z" fill="url(#roof-purple)"/><rect x="25" y="80" width="130" height="100" rx="6" fill="#f3e8ff" stroke="#c084fc" stroke-width="2"/><circle cx="90" cy="130" r="18" fill="none" stroke="#c084fc" stroke-width="2"/>
            <text x="90" y="55" class="text-light">Nhà đa năng</text>
          </svg>

          <!-- 10. SÂN BÓNG -->
          <svg class="block san-bong">
            <rect x="0" y="0" width="180" height="200" rx="12" fill="url(#grass-grad)"/><rect x="0" y="25" width="180" height="25" fill="#ffffff" opacity="0.15"/><rect x="0" y="75" width="180" height="25" fill="#ffffff" opacity="0.15"/><rect x="0" y="125" width="180" height="25" fill="#ffffff" opacity="0.15"/><rect x="0" y="175" width="180" height="25" fill="#ffffff" opacity="0.15"/><rect x="10" y="10" width="160" height="180" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.9"/><line x1="10" y1="100" x2="170" y2="100" stroke="#ffffff" stroke-width="2" opacity="0.9"/><circle cx="90" cy="100" r="25" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.9"/><rect x="55" y="10" width="70" height="15" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.9"/><rect x="55" y="175" width="70" height="15" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
            <text x="90" y="80" class="text-light">Sân bóng</text>
          </svg>

        </div>
      </foreignObject>
    </svg>
  </div>

</body>
</html>
